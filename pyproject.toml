[project]
name = "inventory"
version = "0.1.0"
description = "Snack inventory tracker"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2,<3",
    "sqlalchemy>=2",
    "alembic",
    "pydantic-settings>=2.15.0",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "httpx2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Correctness, imports, modernization, bugbear, plus maintainability:
# C90 cyclomatic complexity, PL the pylint port (design limits on args,
# branches, statements, and returns, plus its convention, error, and
# warning rules), SIM simplify, RET return style, ARG unused args,
# C4 comprehensions, PERF perf lints, ERA commented-out code, T20 print,
# N naming, RUF ruff-specific.
select = [
    "E", "F", "I", "UP", "B",
    "C90", "PL", "SIM", "RET", "ARG", "C4", "PERF", "ERA", "T20", "N", "RUF",
]

[tool.ruff.lint.isort]
# A top-level alembic/ directory would otherwise make ruff treat the alembic
# library as first-party and split it from the other third-party imports.
known-third-party = ["alembic"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` as a parameter default is FastAPI's own dependency-injection
# idiom, not the mutable-default footgun B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-statements = 40

[tool.ruff.lint.per-file-ignores]
# Tests assert against literal values; magic-number warnings are noise there.
"tests/**" = ["PLR2004"]

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
